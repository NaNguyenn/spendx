# Backing services only — the API and the Expo app run on the host (ADR-0006).
# Driven by `podman compose` here; `docker compose` works from the same file.
name: spendx

services:
  postgres:
    image: postgres:17-alpine
    container_name: spendx-pg
    environment:
      POSTGRES_USER: spendx
      POSTGRES_PASSWORD: spendx
      POSTGRES_DB: spendx
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first initialisation of an empty volume. `make db-ensure-test`
      # covers the case where the volume already exists.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spendx -d spendx']
      interval: 2s
      timeout: 3s
      retries: 30

  # SMTP + web UI mail catcher (issue #19). SmtpEmailSender delivers here in
  # development; nothing is ever really sent. No volume — caught mail is
  # disposable. CI does not run compose, so nothing in the test suite may
  # require this container to be up (see FakeEmailSender / EMAIL_SENDER).
  mailpit:
    image: axllent/mailpit:v1.30
    container_name: spendx-mailpit
    ports:
      - '1025:1025' # SMTP — matches SMTP_HOST/SMTP_PORT in .env.example
      - '8025:8025' # Web UI — http://localhost:8025

volumes:
  pgdata:
